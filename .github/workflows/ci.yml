name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --rust-version --workspace --all-targets --ignore-private

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check semver (SDF Glyph Renderer)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: sdf_glyph_renderer
          feature-group: default-features
          features: font

      - name: Check semver (PBF Font Tools)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: pbf_font_tools
          feature-group: default-features
          features: generate

  test:
    name: Run CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'

      - name: Report Rust version
        run: rustc --version && cargo --version

      - name: Run fmt
        run: cargo fmt --all -- --check

      - name: Test Debug
        run: cargo test --workspace --locked

      - name: Test Release
        run: cargo test --workspace --release --locked

      - name: Test without optional font generation
        run: |
          cargo test -p sdf_glyph_renderer --no-default-features --locked
          cargo test -p pbf_font_tools --no-default-features --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test docs
        run: |
          cargo test --workspace --release --doc --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --release --no-deps


  multi-os-test:
    name: Test on multiple OS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          # This is not an exhaustive list of runners, just the more recent ones
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - macos-latest
          - macos-15
          - macos-14  # M1 CPU
          - windows-latest
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'

      - name: Report Rust version
        run: rustc --version && cargo --version

      - name: Run tests
        run: cargo test --workspace --locked

      # Make sure the vendored protoc-generated file is up to date by only checking it on one platform
      # We remove the file first to make sure it gets properly regenerated.
      - if: matrix.os == 'ubuntu-latest'
        name: Validate vendored file
        run: |
          rm pbf_font_tools/src/proto/llmr.glyphs.rs
          cargo clean
          cargo build --workspace --features protoc-vendored
          git diff --exit-code

  freebsd-test:
    runs-on: ubuntu-latest
    name: FreeBSD CI
    steps:
      - uses: actions/checkout@v6
      - name: Test in FreeBSD
        id: test
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y rust
          run: |
            # Run tests
            cargo test --workspace --locked
            # Run tests in release mode
            cargo test --workspace --release --locked
          

